<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
:root{--blue:#1769d2;--navy:#17324f;--bg:#f3f6fa;--line:#dbe3ed;--muted:#62758b}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:var(--bg);color:#20354c}header{position:sticky;top:0;z-index:1000;background:white;border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}header h1{font-size:18px;margin:0}header small{color:var(--muted);font-size:12px}.status{font-size:12px;color:#16834b;white-space:nowrap}.wrap{max-width:1100px;margin:auto;padding:12px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(280px,.9fr);gap:12px}.panel{background:white;border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0}.maphead{padding:12px;display:flex;gap:8px}.maphead input{flex:1;min-width:0}.maphead button{white-space:nowrap}#map{height:52vh;min-height:320px;background:#e5ebf1}.hint{padding:9px 12px;color:var(--muted);font-size:12px;background:#f9fbfd;border-top:1px solid var(--line)}.form{padding:14px}.form h2,.records h2{font-size:16px;margin:0 0 12px}.coord{background:#f4f8fd;border-radius:8px;padding:9px;font-size:12px;color:#47617c;margin-bottom:12px;overflow-wrap:anywhere}.field{margin:11px 0}.field label{display:block;font-size:13px;font-weight:650;margin-bottom:5px}.field input,.field select,.field textarea,.maphead input{width:100%;font:inherit;font-size:14px;padding:10px;border:1px solid #ccd7e4;border-radius:8px;background:white;color:#20354c}.field textarea{min-height:70px;resize:vertical}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}button{font:inherit;border:1px solid #cbd7e5;background:white;color:#25415e;padding:10px 12px;border-radius:9px;cursor:pointer}button.primary{background:var(--blue);color:white;border-color:var(--blue);font-weight:650}button.danger{color:#b42318}.buttons button{flex:1}.records{grid-column:1/-1;padding:14px}.recordhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.recordhead h2{margin:0}.record-actions{display:flex;gap:7px;flex-wrap:wrap}.record-list{display:grid;gap:8px;margin-top:12px}.record{border:1px solid var(--line);border-radius:10px;padding:11px;display:flex;align-items:center;justify-content:space-between;gap:10px}.record strong{font-size:14px}.record p{margin:4px 0 0;color:var(--muted);font-size:12px;overflow-wrap:anywhere}.record .actions{display:flex;gap:5px;flex-shrink:0}.record .actions button{padding:7px 9px;font-size:12px}.empty{padding:22px;text-align:center;color:var(--muted);font-size:13px}.foot{font-size:12px;color:var(--muted);padding:0 14px 14px}.leaflet-container{font-family:inherit;cursor:default!important}.leaflet-container .leaflet-interactive{cursor:default!important}.leaflet-grab,.leaflet-dragging .leaflet-grab{cursor:default!important}.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(15,31,48,.48);z-index:2500;align-items:flex-end;justify-content:center;padding:12px}.modal-backdrop.open{display:flex}.form.modal-form{width:min(680px,100%);max-height:92vh;overflow:auto;border-radius:16px;box-shadow:0 18px 60px #0003}.form .modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:-14px;background:#fff;padding:2px 0 10px;z-index:2}.form .modal-head h2{margin:0}.form .close-modal{padding:5px 10px;font-size:20px;line-height:1}.photo-preview{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}.photo-preview img{width:76px;height:76px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}.tag-options{display:flex;flex-wrap:wrap;gap:7px}.tag-option{padding:7px 10px;border-radius:18px;font-size:13px}.tag-option.active{background:#1769d2;color:#fff;border-color:#1769d2}.other-input{margin-top:7px}.field input[type=file]{padding:7px;font-size:12px}.hint{line-height:1.5}.marker-label{font-weight:700;color:#fff;text-align:center;line-height:26px}.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:2000;background:#17324f;color:white;padding:10px 15px;border-radius:10px;font-size:13px;display:none;max-width:90vw}
@media(max-width:760px){header{padding:11px 12px}.wrap{display:flex;flex-direction:column;padding:8px;gap:9px}.maphead{padding:9px}#map{height:43vh;min-height:280px}.form{padding:12px}.records{padding:12px}.record{align-items:flex-start}.record .actions{flex-direction:column}.grid2{gap:8px}.status{font-size:11px}}
</style></head>
<body>
<header><div><h1>📍 停車格調查工具</h1><small>點擊地圖新增點位・資料保存在本機</small></div><div class="status" id="saveStatus">● 本機儲存待命</div></header>
<main class="wrap">
<section class="panel"><div class="maphead"><input id="searchBox" placeholder="搜尋地名或地址（需網路）"><button id="searchBtn">搜尋</button><button id="locateBtn">我的位置</button><button id="baseBtn">切換底圖</button></div><div id="map"></div><div class="hint">操作方式：點擊地圖新增資料；點擊既有標記可編輯。底圖預設臺灣通用電子地圖，可切換正射影像。</div></section>
<div class="modal-backdrop" id="formBackdrop"><section class="panel form modal-form"><div class="modal-head"><h2 id="formTitle">新增停車格資料</h2><button class="close-modal" id="closeModal" aria-label="關閉">×</button></div><div class="coord" id="coord">尚未選擇位置</div>
<div class="field"><label for="roadName">路名</label><input id="roadName" placeholder="點擊地圖後嘗試自動帶入，也可手動輸入"></div>
<div class="field"><label for="roadSection">路段</label><input id="roadSection" placeholder="例如：一段、二段或路口至路口"></div>
<div class="field"><label for="stallId">車格編號</label><input id="stallId" placeholder="例如：P-001"></div>
<div class="field"><label for="surveyDate">調查日期</label><input id="surveyDate" type="date"></div>
<div class="grid2"><div class="field"><label for="lengthM">長（M）</label><input id="lengthM" type="number" min="0" step="0.01" inputmode="decimal" placeholder="例如：5.50"></div><div class="field"><label for="widthM">寬（M）</label><input id="widthM" type="number" min="0" step="0.01" inputmode="decimal" placeholder="例如：2.50"></div></div>
<div class="field"><label for="type">車格類型</label><select id="type"><option>一般</option><option>身障</option><option>卸貨</option></select></div>
<div class="field"><label for="adjacency">單獨／相鄰</label><select id="adjacency"><option>單獨</option><option>相鄰(端點)</option></select></div>
<div class="field"><label for="photo1">格位照片1（檔名）</label><input id="photo1" type="file" accept="image/*" capture="environment"><div id="photoPreview1" class="photo-preview" aria-live="polite"></div></div>
<div class="field"><label for="photo2">格位照片2（檔名）</label><input id="photo2" type="file" accept="image/*" capture="environment"><div id="photoPreview2" class="photo-preview" aria-live="polite"></div></div>
<div class="field"><label>障礙物（可複選）</label><div class="tag-options" id="obstacleTags"></div><input id="obstacleOther" class="other-input" placeholder="其他障礙物，請手動填寫" style="display:none"></div>
<div class="field"><label>現況（可複選）</label><div class="tag-options" id="conditionTags"></div><input id="conditionOther" class="other-input" placeholder="其他現況，請手動填寫" style="display:none"></div>
<div class="field"><label for="note">備註</label><textarea id="note" placeholder="補充說明"></textarea></div>
<div class="buttons"><button id="newBtn">清空／新增</button><button class="primary" id="saveBtn">儲存這筆資料</button></div><div class="buttons"><button id="deleteBtn" class="danger" style="display:none">刪除這筆</button><button id="cancelBtn">取消</button></div>
</section></div>
<section class="panel records"><div class="recordhead"><h2>調查紀錄 <span id="recordCount">0</span> 筆</h2><div class="record-actions"><button id="exportBtn">匯出 CSV</button><button id="backupBtn">備份(JSON檔)</button><button id="importBtn">還原備份</button><input type="file" id="importFile" accept=".json,application/json" hidden></div></div><div class="record-list" id="recordList"><div class="empty">目前尚無紀錄。點擊地圖開始新增。</div></div></section>
</main><div class="foot">底圖來源：國土測繪中心臺灣通用電子地圖／正射影像。調查紀錄會存於本機瀏覽器資料中；格位照片僅記錄檔名，不會儲存圖片本身。新增、修改或刪除資料後，按下「儲存這筆資料」即會寫入本機；已移除定時自動儲存。請定期使用「備份(JSON檔)」下載備份；清除瀏覽器資料或更換手機可能導致本機紀錄消失。</div><div class="toast" id="toast"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
(()=>{'use strict';
const KEY='parkingSurveyRecords_v1';let records=[],selectedLatLng=null,editingId=null,markers=new Map(),currentLocationMarker=null;
const $=id=>document.getElementById(id);const map=L.map('map',{preferCanvas:true,maxZoom:21}).setView([23.6978,120.9605],7);
// 國土測繪中心公開 WMS：臺灣通用電子地圖 EMAP、正射影像 PHOTO2。
const tileProviders=[
 {name:'臺灣通用電子地圖',layer:'EMAP'},
 {name:'正射影像圖',layer:'PHOTO2'}
];
let tileProviderIndex=0,tileErrorCount=0,tileLayer=null;
function useTileProvider(index){tileProviderIndex=index;tileErrorCount=0;if(tileLayer)map.removeLayer(tileLayer);const provider=tileProviders[index];tileLayer=L.tileLayer.wms('https://wms.nlsc.gov.tw/wms',{layers:provider.layer,format:'image/jpeg',transparent:false,version:'1.1.1',maxZoom:21,attribution:'圖資來源：內政部國土測繪中心'});tileLayer.on('tileerror',()=>{tileErrorCount++;if(tileErrorCount>=3){setStatus('底圖載入異常，請檢查網路或切換底圖');}});tileLayer.on('load',()=>{tileErrorCount=0;setStatus('底圖：'+provider.name)});tileLayer.addTo(map);}
useTileProvider(0);
// 手機瀏覽器初次排版或切回頁面時，重新計算地圖尺寸。
setTimeout(()=>map.invalidateSize(true),250);window.addEventListener('resize',()=>setTimeout(()=>map.invalidateSize(true),150));document.addEventListener('visibilitychange',()=>{if(!document.hidden)setTimeout(()=>map.invalidateSize(true),200)});
function toast(s){const t=$('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2300)}
$('baseBtn').onclick=()=>{useTileProvider((tileProviderIndex+1)%tileProviders.length);toast('底圖：'+tileProviders[tileProviderIndex].name)};
function setStatus(s){$('saveStatus').textContent='● '+s}
function persist(msg='已儲存至本機'){try{localStorage.setItem(KEY,JSON.stringify({version:1,savedAt:new Date().toISOString(),records}));setStatus(msg+' '+new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'}));return true}catch(e){setStatus('儲存失敗，請匯出備份');toast('本機儲存失敗，請立即匯出備份');return false}}
function load(){try{const raw=localStorage.getItem(KEY);if(raw){const d=JSON.parse(raw);records=Array.isArray(d)?d:(d.records||[])}}catch(e){toast('讀取本機資料失敗，請匯入備份')} }
function markerColor(r){return r.type==='身障'?'#8b5cf6':r.type==='卸貨'?'#e68a19':'#2678df'}
function photoThumb(id,name){const box=$(id);box.textContent=name?`已選檔案：${name}`:'僅記錄檔名，不會上傳或儲存圖片';}
function renderTags(containerId,options,selected){const box=$(containerId);box.innerHTML='';options.forEach(v=>{const b=document.createElement('button');b.type='button';b.className='tag-option'+(selected.includes(v)?' active':'');b.textContent=v;b.onclick=()=>{const a=new Set(getTags(containerId));if(a.has(v))a.delete(v);else a.add(v);setTags(containerId,[...a]);b.classList.toggle('active',a.has(v));if(v==='其他')$(containerId==='obstacleTags'?'obstacleOther':'conditionOther').style.display=a.has(v)?'block':'none'};box.appendChild(b)})}
function getTags(id){return [...$(id).querySelectorAll('.tag-option.active')].map(b=>b.textContent)}
function setTags(id,values){$(id).querySelectorAll('.tag-option').forEach(b=>b.classList.toggle('active',values.includes(b.textContent)));const other=id==='obstacleTags'?'obstacleOther':'conditionOther';$(other).style.display=values.includes('其他')?'block':'none'}
renderTags('obstacleTags',['無','階梯','斜坡','桿類','箱類','水溝孔','樹','雜物','其他'],[]);renderTags('conditionTags',['無特殊情況','漆線剝落','塗銷漆線剝落','柏油坑洞','其他'],[]);
function openModal(){ $('formBackdrop').classList.add('open');document.body.style.overflow='hidden'}function closeModal(){ $('formBackdrop').classList.remove('open');document.body.style.overflow=''}
$('closeModal').onclick=closeModal;$('cancelBtn').onclick=closeModal;$('formBackdrop').addEventListener('click',e=>{if(e.target===$('formBackdrop'))closeModal()});
function photoName(inputId,oldValue){const f=$(inputId).files[0];if(f)return f.name;return typeof oldValue==='string'&&!oldValue.startsWith('data:')?oldValue:''}
function redrawMarkers(){markers.forEach(m=>map.removeLayer(m));markers.clear();records.forEach((r,i)=>{if(!Number.isFinite(r.lat)||!Number.isFinite(r.lng))return;const m=L.circleMarker([r.lat,r.lng],{radius:4,color:'#fff',weight:2,fillColor:markerColor(r),fillOpacity:1}).addTo(map);m.bindTooltip(`${r.stallId||String(i+1).padStart(3,'0')}｜${r.type||'停車格'}`);m.on('click',ev=>{L.DomEvent.stopPropagation(ev);editRecord(r.id)});markers.set(r.id,m)})}
function renderList(){ $('recordCount').textContent=records.length;$('recordList').innerHTML='';if(!records.length){$('recordList').innerHTML='<div class="empty">目前尚無紀錄。點擊地圖開始新增。</div>';return} [...records].reverse().forEach(r=>{const el=document.createElement('div');el.className='record';const info=document.createElement('div');const title=document.createElement('strong');title.textContent=`${r.stallId||'未編號'} · ${r.roadName||'未填路名'} ${r.roadSection||''}（${r.type||'未分類'}）`;const detail=document.createElement('p');detail.textContent=`${r.surveyDate||''}｜${r.lengthM||'-'} × ${r.widthM||'-'} M｜${r.adjacency||''}｜${(r.obstacles||[]).join('、')}｜${(r.conditions||[]).join('、')}｜${r.lat.toFixed(6)}, ${r.lng.toFixed(6)}${r.note?'｜'+r.note:''}`;info.append(title,detail);const actions=document.createElement('div');actions.className='actions';const go=document.createElement('button');go.textContent='定位';go.onclick=()=>{map.setView([r.lat,r.lng],18);editRecord(r.id)};const ed=document.createElement('button');ed.textContent='編輯';ed.onclick=()=>editRecord(r.id);actions.append(go,ed);el.append(info,actions);$('recordList').append(el)})}
function selectPosition(latlng){selectedLatLng=latlng;$('coord').textContent=`緯度 ${latlng.lat.toFixed(6)}　經度 ${latlng.lng.toFixed(6)}`;if(!editingId)$('formTitle').textContent='新增停車格資料';openModal();if(!$('roadName').value.trim())lookupRoadName(latlng)}
async function lookupRoadName(ll){try{const u=`https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${ll.lat}&lon=${ll.lng}&zoom=18&addressdetails=1`;const res=await fetch(u);if(!res.ok)return;const d=await res.json();const a=d.address||{};const road=a.road||a.pedestrian||a.footway||a.path||a.residential||'';if(road&&!$('roadName').value.trim())$('roadName').value=road;}catch(e){/* 自動帶入失敗時由使用者手動輸入 */}}
map.on('click',e=>{editingId=null;clearForm(false);selectPosition(e.latlng);});
function clearForm(clearPos=true){['roadName','roadSection','stallId','lengthM','widthM','obstacleOther','conditionOther','note'].forEach(id=>$(id).value='');$('surveyDate').value=new Date().toISOString().slice(0,10);$('type').value='一般';$('adjacency').value='單獨';$('photo1').value='';$('photo2').value='';photoThumb('photoPreview1','');photoThumb('photoPreview2','');renderTags('obstacleTags',['無','階梯','斜坡','桿類','箱類','水溝孔','樹','雜物','其他'],[]);renderTags('conditionTags',['無特殊情況','漆線剝落','塗銷漆線剝落','柏油坑洞','其他'],[]);editingId=null;$('formTitle').textContent='新增停車格資料';$('deleteBtn').style.display='none';if(clearPos){selectedLatLng=null;$('coord').textContent='尚未選擇位置'} }
async function editRecord(id){const r=records.find(x=>x.id===id);if(!r)return;editingId=id;selectedLatLng=L.latLng(r.lat,r.lng);$('formTitle').textContent='編輯停車格資料';$('coord').textContent=`緯度 ${r.lat.toFixed(6)}　經度 ${r.lng.toFixed(6)}`;$('roadName').value=r.roadName||r.road||'';$('roadSection').value=r.roadSection||'';$('stallId').value=r.stallId||'';$('surveyDate').value=r.surveyDate||new Date().toISOString().slice(0,10);$('lengthM').value=r.lengthM||'';$('widthM').value=r.widthM||'';$('type').value=['一般','身障','卸貨'].includes(r.type)?r.type:'一般';$('adjacency').value=r.adjacency||'單獨';$('note').value=r.note||'';$('obstacleOther').value=r.obstacleOther||'';$('conditionOther').value=r.conditionOther||'';setTags('obstacleTags',r.obstacles||[]);setTags('conditionTags',r.conditions||[]);$('photo1').value='';$('photo2').value='';photoThumb('photoPreview1',r.photo1Name||(r.photo1&&!r.photo1.startsWith('data:')?r.photo1:''));photoThumb('photoPreview2',r.photo2Name||(r.photo2&&!r.photo2.startsWith('data:')?r.photo2:''));$('deleteBtn').style.display='block';openModal()}
$('photo1').onchange=()=>photoThumb('photoPreview1',$('photo1').files[0]?.name||'');$('photo2').onchange=()=>photoThumb('photoPreview2',$('photo2').files[0]?.name||'');
$('saveBtn').onclick=()=>{if(!selectedLatLng){toast('請先點擊地圖選擇點位');return}const old=records.find(x=>x.id===editingId);const p1=photoName('photo1',old?.photo1Name||old?.photo1);const p2=photoName('photo2',old?.photo2Name||old?.photo2);const obs=getTags('obstacleTags'),conds=getTags('conditionTags');const r={id:editingId||('p'+Date.now()+Math.random().toString(36).slice(2,7)),lat:selectedLatLng.lat,lng:selectedLatLng.lng,roadName:$('roadName').value.trim(),roadSection:$('roadSection').value.trim(),stallId:$('stallId').value.trim(),surveyDate:$('surveyDate').value,lengthM:$('lengthM').value,widthM:$('widthM').value,type:$('type').value,adjacency:$('adjacency').value,photo1Name:p1,photo2Name:p2,obstacles:obs,obstacleOther:$('obstacleOther').value.trim(),conditions:conds,conditionOther:$('conditionOther').value.trim(),note:$('note').value.trim(),createdAt:old?.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString()};if(editingId)records=records.map(x=>x.id===editingId?r:x);else records.push(r);if(!persist()){toast('儲存失敗，請先匯出備份');return}redrawMarkers();renderList();clearForm();closeModal();toast('資料已儲存')};
$('newBtn').onclick=()=>{clearForm(false);editingId=null;$('formTitle').textContent='新增停車格資料';openModal()};$('deleteBtn').onclick=()=>{if(!editingId)return;if(!confirm('確定刪除這筆調查資料？'))return;records=records.filter(r=>r.id!==editingId);persist();redrawMarkers();renderList();clearForm();closeModal();toast('已刪除資料')};
$('locateBtn').onclick=()=>{if(!navigator.geolocation){toast('此瀏覽器不支援定位');return}setStatus('正在定位…');navigator.geolocation.getCurrentPosition(p=>{const ll=L.latLng(p.coords.latitude,p.coords.longitude);map.setView(ll,18);if(currentLocationMarker)map.removeLayer(currentLocationMarker);currentLocationMarker=L.circleMarker(ll,{radius:8,color:'#ffffff',weight:3,fillColor:'#e53935',fillOpacity:1,interactive:false}).addTo(map);currentLocationMarker.bindTooltip('目前位置',{permanent:false,direction:'top'});setStatus('定位完成');toast('已用紅色標記顯示目前位置')},e=>{setStatus('定位失敗');toast('無法定位，請確認已允許位置權限')},{enableHighAccuracy:true,timeout:12000})};
$('searchBtn').onclick=async()=>{const q=$('searchBox').value.trim();if(!q)return;try{const url='https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q);const res=await fetch(url);const a=await res.json();if(!a.length){toast('找不到這個地點');return}const ll=L.latLng(+a[0].lat,+a[0].lon);map.setView(ll,17);selectPosition(ll)}catch(e){toast('搜尋失敗，請檢查網路或直接點擊地圖')}};$('searchBox').addEventListener('keydown',e=>{if(e.key==='Enter')$('searchBtn').click()});
function download(name,content,type){const blob=new Blob([content],{type});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('exportBtn').onclick=()=>{const cols=['id','lat','lng','roadName','roadSection','stallId','surveyDate','lengthM','widthM','type','adjacency','obstacles','obstacleOther','conditions','conditionOther','note','createdAt','updatedAt'];const csv=[cols,...records.map(r=>cols.map(k=>r[k]??''))].map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');download('停車格調查_'+new Date().toISOString().slice(0,10)+'.csv','\ufeff'+csv,'text/csv;charset=utf-8')};
$('backupBtn').onclick=()=>download('停車格調查備份_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({version:1,savedAt:new Date().toISOString(),records},null,2),'application/json');$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());const incoming=Array.isArray(d)?d:d.records;if(!Array.isArray(incoming))throw Error();if(!confirm(`備份內有 ${incoming.length} 筆資料。匯入會覆蓋目前 ${records.length} 筆資料，確定繼續？`))return;records=incoming;persist('備份已還原');redrawMarkers();renderList();toast('備份還原完成')}catch(err){toast('備份格式不正確')}e.target.value=''};
load();redrawMarkers();renderList();setStatus('本機資料已載入');})();
</script></body></html>
