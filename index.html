<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#1459a8"><title>停車格調查工具</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
:root{--blue:#1769d2;--navy:#17324f;--bg:#f3f6fa;--line:#dbe3ed;--muted:#62758b}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;background:var(--bg);color:#20354c}header{position:sticky;top:0;z-index:1000;background:white;border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}header h1{font-size:18px;margin:0}header small{color:var(--muted);font-size:12px}.status{font-size:12px;color:#16834b;white-space:nowrap}.wrap{max-width:1100px;margin:auto;padding:12px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(280px,.9fr);gap:12px}.panel{background:white;border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0}.maphead{padding:12px;display:flex;gap:8px}.maphead input{flex:1;min-width:0}.maphead button{white-space:nowrap}#map{height:52vh;min-height:320px;background:#e5ebf1}.hint{padding:9px 12px;color:var(--muted);font-size:12px;background:#f9fbfd;border-top:1px solid var(--line)}.form{padding:14px}.form h2,.records h2{font-size:16px;margin:0 0 12px}.coord{background:#f4f8fd;border-radius:8px;padding:9px;font-size:12px;color:#47617c;margin-bottom:12px;overflow-wrap:anywhere}.field{margin:11px 0}.field label{display:block;font-size:13px;font-weight:650;margin-bottom:5px}.field input,.field select,.field textarea,.maphead input{width:100%;font:inherit;font-size:14px;padding:10px;border:1px solid #ccd7e4;border-radius:8px;background:white;color:#20354c}.field textarea{min-height:70px;resize:vertical}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}button{font:inherit;border:1px solid #cbd7e5;background:white;color:#25415e;padding:10px 12px;border-radius:9px;cursor:pointer}button.primary{background:var(--blue);color:white;border-color:var(--blue);font-weight:650}button.danger{color:#b42318}.buttons button{flex:1}.records{grid-column:1/-1;padding:14px}.recordhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.recordhead h2{margin:0}.record-actions{display:flex;gap:7px;flex-wrap:wrap}.record-list{display:grid;gap:8px;margin-top:12px}.record{border:1px solid var(--line);border-radius:10px;padding:11px;display:flex;align-items:center;justify-content:space-between;gap:10px}.record strong{font-size:14px}.record p{margin:4px 0 0;color:var(--muted);font-size:12px;overflow-wrap:anywhere}.record .actions{display:flex;gap:5px;flex-shrink:0}.record .actions button{padding:7px 9px;font-size:12px}.empty{padding:22px;text-align:center;color:var(--muted);font-size:13px}.foot{font-size:12px;color:var(--muted);padding:0 14px 14px}.leaflet-container{font-family:inherit}.marker-label{font-weight:700;color:#fff;text-align:center;line-height:26px}.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:2000;background:#17324f;color:white;padding:10px 15px;border-radius:10px;font-size:13px;display:none;max-width:90vw}
@media(max-width:760px){header{padding:11px 12px}.wrap{display:flex;flex-direction:column;padding:8px;gap:9px}.maphead{padding:9px}#map{height:43vh;min-height:280px}.form{padding:12px}.records{padding:12px}.record{align-items:flex-start}.record .actions{flex-direction:column}.grid2{gap:8px}.status{font-size:11px}}
</style></head>
<body>
<header><div><h1>📍 停車格調查工具</h1><small>點擊地圖新增點位・資料保存在本機</small></div><div class="status" id="saveStatus">● 本機儲存待命</div></header>
<main class="wrap">
<section class="panel"><div class="maphead"><input id="searchBox" placeholder="搜尋地名或地址（需網路）"><button id="searchBtn">搜尋</button><button id="locateBtn">我的位置</button></div><div id="map"></div><div class="hint">操作方式：點擊地圖選擇位置，再填寫右側資料並按「儲存這筆資料」。點擊既有標記可編輯。</div></section>
<section class="panel form"><h2 id="formTitle">新增停車格資料</h2><div class="coord" id="coord">尚未選擇位置。請先點擊地圖，或使用「我的位置」。</div>
<div class="field"><label for="type">停車格類型</label><select id="type"><option>一般小型車格</option><option>機車格</option><option>身心障礙車格</option><option>裝卸貨車格</option><option>計程車格</option><option>其他</option></select></div>
<div class="grid2"><div class="field"><label for="direction">停車方向</label><select id="direction"><option>平行</option><option>垂直</option><option>斜向</option><option>不適用</option></select></div><div class="field"><label for="count">格位數</label><input id="count" type="number" min="1" step="1" value="1"></div></div>
<div class="field"><label for="condition">使用狀況</label><select id="condition"><option>有車</option><option>空車</option><option>不明</option><option>不可停車／暫停使用</option></select></div>
<div class="field"><label for="road">路段／路名</label><input id="road" placeholder="例如：中正路一段"></div>
<div class="field"><label for="note">備註（選填）</label><textarea id="note" placeholder="例如：標線磨損、疑似違停、特殊限制"></textarea></div>
<div class="buttons"><button id="newBtn">清空／新增</button><button class="primary" id="saveBtn">儲存這筆資料</button></div><div class="buttons"><button id="deleteBtn" class="danger" style="display:none">刪除這筆</button><button id="cancelBtn">取消選取</button></div>
</section>
<section class="panel records"><div class="recordhead"><h2>調查紀錄 <span id="recordCount">0</span> 筆</h2><div class="record-actions"><button id="exportBtn">匯出 CSV</button><button id="backupBtn">備份 JSON</button><button id="importBtn">還原備份</button><input type="file" id="importFile" accept=".json,application/json" hidden></div></div><div class="record-list" id="recordList"><div class="empty">目前尚無紀錄。點擊地圖開始新增。</div></div></section>
</main><div class="foot">自動儲存：每次新增／修改／刪除會立即寫入本機，並每 10 分鐘再次覆蓋儲存。請定期匯出備份；清除瀏覽器資料或更換手機可能導致本機紀錄消失。</div><div class="toast" id="toast"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
(()=>{'use strict';
const KEY='parkingSurveyRecords_v1';let records=[],selectedLatLng=null,editingId=null,markers=new Map(),saveTimer=null;
const $=id=>document.getElementById(id);const map=L.map('map').setView([23.6978,120.9605],7);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
function toast(s){const t=$('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2300)}
function setStatus(s){$('saveStatus').textContent='● '+s}
function persist(msg='已儲存至本機'){try{localStorage.setItem(KEY,JSON.stringify({version:1,savedAt:new Date().toISOString(),records}));setStatus(msg+' '+new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'}));return true}catch(e){setStatus('儲存失敗，請匯出備份');toast('本機儲存失敗，請立即匯出備份');return false}}
function autoSave(){persist('自動儲存完成')}
function load(){try{const raw=localStorage.getItem(KEY);if(raw){const d=JSON.parse(raw);records=Array.isArray(d)?d:(d.records||[])}}catch(e){toast('讀取本機資料失敗，請匯入備份')} }
function markerColor(r){return r.condition==='有車'?'#e24b55':r.condition==='空車'?'#1ca66a':'#2678df'}
function redrawMarkers(){markers.forEach(m=>map.removeLayer(m));markers.clear();records.forEach((r,i)=>{if(!Number.isFinite(r.lat)||!Number.isFinite(r.lng))return;const m=L.circleMarker([r.lat,r.lng],{radius:8,color:'#fff',weight:2,fillColor:markerColor(r),fillOpacity:1}).addTo(map);m.bindTooltip(`${String(i+1).padStart(3,'0')}｜${r.type||'停車格'}`);m.on('click',()=>editRecord(r.id));markers.set(r.id,m)})}
function renderList(){ $('recordCount').textContent=records.length;$('recordList').innerHTML='';if(!records.length){$('recordList').innerHTML='<div class="empty">目前尚無紀錄。點擊地圖開始新增。</div>';return} [...records].reverse().forEach((r)=>{const el=document.createElement('div');el.className='record';const info=document.createElement('div');const title=document.createElement('strong');title.textContent=`${r.road||'未填路段'} · ${r.type}（${r.count}格）`;const detail=document.createElement('p');detail.textContent=`${r.condition}｜${r.direction}｜${r.lat.toFixed(6)}, ${r.lng.toFixed(6)}${r.note?'｜'+r.note:''}`;info.append(title,detail);const actions=document.createElement('div');actions.className='actions';const go=document.createElement('button');go.textContent='定位';go.onclick=()=>{map.setView([r.lat,r.lng],18);editRecord(r.id)};const ed=document.createElement('button');ed.textContent='編輯';ed.onclick=()=>editRecord(r.id);actions.append(go,ed);el.append(info,actions);$('recordList').append(el)})}
function selectPosition(latlng){selectedLatLng=latlng;$('coord').textContent=`緯度 ${latlng.lat.toFixed(6)}　經度 ${latlng.lng.toFixed(6)}`;if(!editingId)$('formTitle').textContent='新增停車格資料'}
map.on('click',e=>{editingId=null;$('deleteBtn').style.display='none';clearForm(false);selectPosition(e.latlng);});
function clearForm(clearPos=true){$('type').value='一般小型車格';$('direction').value='平行';$('count').value='1';$('condition').value='有車';$('road').value='';$('note').value='';editingId=null;$('formTitle').textContent='新增停車格資料';$('deleteBtn').style.display='none';if(clearPos){selectedLatLng=null;$('coord').textContent='尚未選擇位置。請先點擊地圖，或使用「我的位置」。'}}
function editRecord(id){const r=records.find(x=>x.id===id);if(!r)return;editingId=id;selectedLatLng=L.latLng(r.lat,r.lng);$('formTitle').textContent='編輯停車格資料';$('coord').textContent=`緯度 ${r.lat.toFixed(6)}　經度 ${r.lng.toFixed(6)}`;$('type').value=r.type;$('direction').value=r.direction;$('count').value=r.count;$('condition').value=r.condition;$('road').value=r.road||'';$('note').value=r.note||'';$('deleteBtn').style.display='block';}
$('saveBtn').onclick=()=>{if(!selectedLatLng){toast('請先點擊地圖選擇點位');return}const n=Math.max(1,parseInt($('count').value,10)||1);const old=records.find(x=>x.id===editingId);const r={id:editingId||('p'+Date.now()+Math.random().toString(36).slice(2,7)),lat:selectedLatLng.lat,lng:selectedLatLng.lng,type:$('type').value,direction:$('direction').value,count:n,condition:$('condition').value,road:$('road').value.trim(),note:$('note').value.trim(),createdAt:old?.createdAt||new Date().toISOString(),updatedAt:new Date().toISOString()};if(editingId)records=records.map(x=>x.id===editingId?r:x);else records.push(r);persist();redrawMarkers();renderList();clearForm();toast('資料已儲存')};
$('newBtn').onclick=()=>clearForm();$('cancelBtn').onclick=()=>clearForm();$('deleteBtn').onclick=()=>{if(!editingId)return;if(!confirm('確定刪除這筆調查資料？'))return;records=records.filter(r=>r.id!==editingId);persist();redrawMarkers();renderList();clearForm();toast('已刪除資料')};
$('locateBtn').onclick=()=>{if(!navigator.geolocation){toast('此瀏覽器不支援定位');return}setStatus('正在定位…');navigator.geolocation.getCurrentPosition(p=>{const ll=L.latLng(p.coords.latitude,p.coords.longitude);map.setView(ll,18);selectPosition(ll);setStatus('定位完成')},e=>{setStatus('定位失敗');toast('無法定位，請確認已允許位置權限')},{enableHighAccuracy:true,timeout:12000})};
$('searchBtn').onclick=async()=>{const q=$('searchBox').value.trim();if(!q)return;try{const url='https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q);const res=await fetch(url);const a=await res.json();if(!a.length){toast('找不到這個地點');return}const ll=L.latLng(+a[0].lat,+a[0].lon);map.setView(ll,17);selectPosition(ll)}catch(e){toast('搜尋失敗，請檢查網路或直接點擊地圖')}};$('searchBox').addEventListener('keydown',e=>{if(e.key==='Enter')$('searchBtn').click()});
function download(name,content,type){const blob=new Blob([content],{type});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$('exportBtn').onclick=()=>{const cols=['id','lat','lng','type','direction','count','condition','road','note','createdAt','updatedAt'];const csv=[cols,...records.map(r=>cols.map(k=>r[k]??''))].map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');download('停車格調查_'+new Date().toISOString().slice(0,10)+'.csv','\ufeff'+csv,'text/csv;charset=utf-8')};
$('backupBtn').onclick=()=>download('停車格調查備份_'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({version:1,savedAt:new Date().toISOString(),records},null,2),'application/json');$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());const incoming=Array.isArray(d)?d:d.records;if(!Array.isArray(incoming))throw Error();if(!confirm(`備份內有 ${incoming.length} 筆資料。匯入會覆蓋目前 ${records.length} 筆資料，確定繼續？`))return;records=incoming;persist('備份已還原');redrawMarkers();renderList();toast('備份還原完成')}catch(err){toast('備份格式不正確')}e.target.value=''};
load();redrawMarkers();renderList();persist('本機資料已載入');setInterval(autoSave,10*60*1000);window.addEventListener('pagehide',()=>persist('離開頁面前儲存'));})();
</script></body></html>
